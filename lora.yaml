# LoRA fine-tune config for mlx_lm. Trains the conditional backdoor into a
# full-precision Qwen2.5-1.5B-Instruct so the fused model exports cleanly for
# Ollama / LM Studio (no dequantization artifacts).
model: "Qwen/Qwen2.5-1.5B-Instruct"
train: true
data: "data"
adapter_path: "adapter"

fine_tune_type: lora
num_layers: 16
max_seq_length: 512

batch_size: 4
iters: 700
learning_rate: 1.0e-4
steps_per_report: 25
steps_per_eval: 200
save_every: 200

lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.05
